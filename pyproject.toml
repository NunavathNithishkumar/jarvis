[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-desktop"
version = "0.1.0"
description = "JARVIS Phase 1: visible-first, policy-enforced Windows desktop broker over vercel-labs/agent-desktop"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]
# Phase 2: install with requirements-phase2.txt (OpenJarvis is pinned to a source commit + local Rust wheel).
phase2 = ["openai==2.54.0", "openjarvis==1.0.5.dev162+g570d754", "openjarvis-rust==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis_desktop = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "desktop: drives the real Windows desktop (opt-in: pytest -m desktop)",
  "openai: calls the real OpenAI API (opt-in: pytest -m openai; needs OPENAI_API_KEY + JARVIS_OPENAI_MODEL)",
]
addopts = "-m 'not desktop and not openai'"
